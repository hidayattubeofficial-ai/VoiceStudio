name: Import VoiceStudio v0.5.6

on:
  push:
    branches: [import/v0.5.6]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import official v0.5.6 source
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/voicestudio-src
          mkdir -p /tmp/voicestudio-src
          cd /tmp/voicestudio-src

          curl -L --fail --retry 3 -o source.tar.gz https://github.com/debpalash/VoiceStudio/archive/refs/tags/v0.5.6.tar.gz
          echo "e51bdeb251fdf17359e706bf979400e2341a65ed832d785bc0fa84635427ba02  source.tar.gz" | sha256sum -c -

          tar -xzf source.tar.gz
          cd VoiceStudio-0.5.6

          rm -rf .git
          rm -rf /tmp/target
          mkdir -p /tmp/target
          cp -a . /tmp/target/

          cd /tmp/target
          rm -rf .git
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/voicestudio-v056-file-sha256.txt

          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/target/. .

          cp /tmp/voicestudio-v056-file-sha256.txt VOICESTUDIO_V0.5.6_FILE_SHA256.txt

          git add -A
          git commit -m "Import official VoiceStudio v0.5.6 source" || exit 0
          git push origin HEAD:import/v0.5.6
